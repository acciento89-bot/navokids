name: Validate NavoKids

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify app and launch icon identity
        run: |
          node - <<'NODE'
          const c=require('./app.json').expo;
          if(c.icon !== './assets/app-icon.png') throw new Error('Unexpected canonical NavoKids app icon');
          if(c.icon !== c.splash?.image) throw new Error('NavoKids splash image must use the same canonical app icon as expo.icon');
          if(c.android?.adaptiveIcon) throw new Error('NavoKids adaptiveIcon must stay disabled so Android installs the canonical app icon directly');
          if(c.android?.package !== 'com.kamilunavo.navokids') throw new Error('Unexpected NavoKids Android package');
          NODE
      - run: npm run typecheck
      - run: npm run content:check
      - run: npm run islands:check
      - run: npm run progress:check
      - run: npm run navigation:check
      - run: node scripts/validate-voice-pack.cjs
      - run: npm run store:check
      - run: npx expo export --platform all
        env:
          CI: "1"
          EXPO_NO_DOCTOR: "1"
