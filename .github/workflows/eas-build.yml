name: Build and submit progression fix to TestFlight

on:
  push:
    branches: [release-ios-progression-fix]
    paths:
      - ".github/workflows/eas-build.yml"

jobs:
  build_ios:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run content:check
      - run: npm run progress:check
      - run: npm run store:check
      - name: Start iOS production build and TestFlight submission
        run: eas build --platform ios --profile production --non-interactive --auto-submit --no-wait
