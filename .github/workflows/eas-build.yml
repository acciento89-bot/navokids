name: Submit NavoKids to Google Play Internal

on:
  push:
    branches: [eas-bootstrap]
    paths:
      - ".github/workflows/eas-build.yml"

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Submit Android build to internal track
        run: eas submit --platform android --id b14ad7d6-226f-414d-9de0-4c350b3d1285 --profile production --non-interactive --wait
