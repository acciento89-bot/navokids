name: EAS Store Builds

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        type: choice
        options: [android, ios, all]
        default: android
  push:
    branches: [eas-bootstrap]
    paths:
      - ".github/workflows/eas-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_PLATFORM: ${{ inputs.platform || 'android' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run content:check
      - run: npm run store:check
      - name: Link EAS project on first run
        run: |
          if ! node -e "const app=require('./app.json'); process.exit(app.expo.extra?.eas?.projectId ? 0 : 1)"; then
            eas init --force --non-interactive
          fi
      - name: Start store build
        run: eas build --platform "$BUILD_PLATFORM" --profile production --non-interactive --no-wait
