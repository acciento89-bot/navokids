name: NavoKids 0.3.2 Store Uploads
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/navokids-release-032.yml']
permissions:
  contents: read
concurrency:
  group: navokids-store-release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: node scripts/validate-voice-pack.cjs
      - name: Inspect previous versions and queue signed production build
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          eas build:list --platform "$RELEASE_PLATFORM" --limit 3 --json --non-interactive > previous.json
          node -e 'for (const b of require("./previous.json")) console.log(JSON.stringify({id:b.id,status:b.status,version:b.appVersion,build:b.appBuildVersion}))'
          eas build --platform "$RELEASE_PLATFORM" --profile production --non-interactive --no-wait --json > build.json
          node -e 'const data=require("./build.json"); for(const b of Array.isArray(data)?data:[data]) console.log(JSON.stringify({id:b.id,platform:b.platform,status:b.status,version:b.appVersion,build:b.appBuildVersion}))'
      - uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ matrix.platform }}
          path: build.json
          if-no-files-found: error
          retention-days: 14
  upload:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-build-${{ matrix.platform }}
      - name: Wait for exact build and upload to store
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: node scripts/upload-release.cjs
