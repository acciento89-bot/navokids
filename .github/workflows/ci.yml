name: Validate NavoKids

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify app and launch icon identity
        run: node -e "const c=require('./app.json').expo; if(c.icon!==c.splash?.image) throw new Error('NavoKids splash image must use the same canonical app icon as expo.icon');"
      - run: npm run typecheck
      - run: npm run content:check
      - run: npm run islands:check
      - run: npm run progress:check
      - run: npm run navigation:check
      - run: node scripts/validate-voice-pack.cjs
      - run: npm run store:check
      - run: npx expo export --platform all
        env:
          CI: "1"
          EXPO_NO_DOCTOR: "1"
