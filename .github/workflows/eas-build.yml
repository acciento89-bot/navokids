name: Inspect EAS Android Builds

on:
  push:
    branches: [eas-bootstrap]
    paths:
      - ".github/workflows/eas-build.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: List Android builds
        run: eas build:list --platform android --limit 5 --json --non-interactive
