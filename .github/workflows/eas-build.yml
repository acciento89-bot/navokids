name: EAS Store Builds

on:
  push:
    branches: [main]
    paths:
      - .eas-ios-release
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        type: choice
        options: [android, ios, all]
        default: android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run content:check
      - run: npm run progress:check
      - run: npm run store:check
      - name: Start store build
        env:
          BUILD_PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'ios' }}
        run: eas build --platform "$BUILD_PLATFORM" --profile production --auto-submit --non-interactive --no-wait
