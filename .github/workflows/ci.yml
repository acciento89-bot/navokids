name: Validate NavoKids

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run content:check
      - run: npm run store:check
      - run: npx expo export --platform android
        env:
          CI: "1"
          EXPO_NO_DOCTOR: "1"
