name: Native eight-island screenshots
# Verify the final seamless eight-island map.
on:
  push:
    branches: [feat/eight-learning-islands]
    paths: [.github/workflows/native-island-qa.yml]
permissions:
  contents: read
jobs:
  native-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: node scripts/validate-voice-pack.cjs
      - name: Build isolated native UI capture entry
        run: |
          cp scripts/native-preview-app.js App.tsx
          npm run prebuild:android
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
        env:
          CI: '1'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            python scripts/capture-native-islands.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navokids-native-eight-islands
          path: native-screenshots/
          retention-days: 14
