name: Recover completed island voice pack
on:
  push:
    branches: [feat/eight-learning-islands]
    paths: [.github/workflows/recover-island-voice.yml]
permissions:
  contents: write
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: navi-eight-islands-marin-checkpoint
          run-id: 34535768932
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: voice-checkpoint
      - run: node scripts/recover-island-voice.cjs
        env:
          EXPECTED_CONTENT_SHA: cdec999b6a72f51c5b76a1b15594cf7406e20a093006d092bfdb1f5666447a9d
      - name: Remove temporary source copy before TypeScript validation
        run: rm -rf voice-checkpoint
      - run: npm run voice:generate
      - run: node scripts/validate-voice-pack.cjs
      - run: npm run typecheck && npm run content:check && npm run islands:check && npm run navigation:check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio src/generated
          git commit -m "feat: bundle verified Marin recordings for eight islands"
          git push origin HEAD:feat/eight-learning-islands
