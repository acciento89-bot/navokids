name: Navi Voice Samples

on:
  workflow_dispatch:
  push:
    branches: [feat/navi-voice-pack]
    paths:
      - ".github/workflows/navi-voice-samples.yml"
      - "scripts/generate-voice-samples.cjs"
      - "scripts/navi-tts.cjs"

jobs:
  generate-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate three German and three English Navi samples
        run: npm run voice:samples
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: navi-voice-samples
          path: voice-samples/*.aac
          if-no-files-found: error
          retention-days: 7
