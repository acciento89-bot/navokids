name: Submit NavoKids to TestFlight

on:
  push:
    branches: [eas-bootstrap]
    paths:
      - ".github/workflows/eas-build.yml"

jobs:
  submit_ios:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Submit signed iOS build to TestFlight
        run: eas submit --platform ios --id 3b5b4a68-d4b2-4a77-abbc-11a871454070 --profile production --non-interactive --wait
