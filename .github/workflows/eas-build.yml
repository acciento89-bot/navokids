name: Monitor EAS Android Build

on:
  push:
    branches: [eas-bootstrap]
    paths:
      - ".github/workflows/eas-build.yml"

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_ID: b14ad7d6-226f-414d-9de0-4c350b3d1285
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Wait for linked Android build
        shell: bash
        run: |
          for attempt in {1..50}; do
            build_json="$(eas build:view "$BUILD_ID" --json)"
            build_status="$(printf '%s' "$build_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).status))")"
            echo "EAS_BUILD_STATUS=$build_status"
            if [ "$build_status" = "FINISHED" ]; then
              printf '%s' "$build_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const b=JSON.parse(s); console.log('EAS_BUILD_URL='+(b.artifacts?.buildUrl || b.artifacts?.applicationArchiveUrl || 'available in Expo dashboard'))})"
              exit 0
            fi
            if [ "$build_status" = "ERRORED" ] || [ "$build_status" = "CANCELED" ]; then
              printf '%s\n' "$build_json"
              exit 1
            fi
            sleep 30
          done
          echo "Build did not finish within the monitoring window."
          exit 1
